<circle cx="1060" cy="90" r="260" fill="#8E2FB8" opacity=".55"/>
<circle cx="1120" cy="620" r="200" fill="#5E1480" opacity=".6"/>
<text x="80" y="140" font-family="Sora,Arial,sans-serif" font-size="64" font-weight="700" fill="#FFC20E">&amp;</text><text x="136" y="140" font-family="Sora,Arial,sans-serif" font-size="64" font-weight="700" fill="#FFFFFF">insieme</text>
<g font-family="Sora,Arial,sans-serif" font-size="68" font-weight="700" fill="#FFFFFF">
<text x="80" y="290">Paga en Colombia</text>
<text x="80" y="370">desde donde estés.</text>
<text x="80" y="480" fill="#FFC20E">Tu familia lo recibe</text>
