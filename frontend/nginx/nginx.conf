server {
    listen 4004;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain application/xml text/css application/javascript;
    gzip_vary on;

    include /etc/nginx/mime.types;

    location = /pay {
        return 301 /pay/;
    }

    location = /pay/env.js {
        add_header Cache-Control "no-store";
    }

    location /pay/ {
        try_files $uri $uri/ /pay/index.html;
        # The SPA entry must always be revalidated: a cached index.html would
        # keep pointing at hashed chunks that no longer exist after a deploy.
        add_header Cache-Control "no-cache";

        # Hashed build output: safe to cache for a long time.
        location ^~ /pay/assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|ico)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";

        location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot|ico)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }

    location ~ /\. {
        deny  all;
        access_log off;
        log_not_found off;
    }
}
